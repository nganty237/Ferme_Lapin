<div class="h-screen w-screen overflow-hidden flex" style="background:var(--color-bg-main);">
  <!-- Sidebar -->
  <aside class="sidebar-container h-full shrink-0 z-20" [style.width.px]="sidebarCollapsed ? 80 : 240" style="transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 2px 0 8px rgba(0,0,0,0.05);">
    <app-sidebar [collapsed]="sidebarCollapsed" (toggle)="sidebarCollapsed = !sidebarCollapsed"></app-sidebar>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col min-w-0 h-full relative" style="transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);">
    <!-- Modern, Professional Header -->
    <header class="flex justify-between items-center px-6 h-16 sticky top-0 z-10 transition-all duration-300" style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border); box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
      
      <!-- Minimalist Title -->
      <div class="flex items-center gap-4">
        <span style="color: var(--color-text-main); font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">
          Espace de Gestion
        </span>
      </div>

      <!-- Actions & Profile -->
      <div class="flex items-center gap-5">
        <!-- Status Indicator (Professional, pulsing) -->
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full" style="background: var(--color-success-bg); border: 1px solid rgba(22, 163, 74, 0.2);">
          <div class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" style="background: var(--color-success);"></span>
            <span class="relative inline-flex rounded-full h-2 w-2" style="background: var(--color-success);"></span>
          </div>
          <span style="font-size: 11px; font-weight: 600; color: var(--color-success); text-transform: uppercase; letter-spacing: 0.05em;">
            En ligne
          </span>
        </div>

        <!-- Profile / Notifications -->
        <div class="flex items-center gap-4 border-l pl-5" style="border-color: var(--color-border);">
          <div class="h-9 w-9 rounded-full flex items-center justify-center shadow-sm cursor-pointer hover:shadow-md transition-shadow" style="background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary-dark)); color: white; font-weight: 600; font-size: 14px;">
            A
          </div>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto overflow-x-hidden p-6">
      <router-outlet />
    </div>
  </main>
  <app-toast-container></app-toast-container>
</div>
