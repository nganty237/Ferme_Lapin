<div class="flex items-center gap-2 cursor-pointer select-none" [matMenuTriggerFor]="menu">
  <div class="relative">
    <div class="h-8 w-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-700 font-bold text-xs overflow-hidden">
      ER
    </div>
    <span class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full bg-emerald-500 border-2 border-white"></span>
  </div>
  <span class="text-xs font-semibold text-slate-700 hover:text-slate-900 transition-colors">EDO Raissa</span>
  <mat-icon style="font-size: 16px; width: 16px; height: 16px; color: #64748b; display: flex; align-items: center; justify-content: center;">
    keyboard_arrow_down
  </mat-icon>
</div>

<mat-menu #menu="matMenu" xPosition="before" class="modern-user-menu">
  <button mat-menu-item (click)="logout()" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
    <mat-icon style="color: #ef4444; font-size: 18px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; margin-right: 8px;">logout</mat-icon>
    <span class="text-slate-700 font-medium">Déconnexion</span>
  </button>
</mat-menu>
