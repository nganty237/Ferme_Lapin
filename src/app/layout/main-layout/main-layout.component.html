<div class="h-screen w-screen overflow-hidden flex" style="background:var(--color-bg-main);">
      <aside
        class="sidebar-container h-full shrink-0 z-20 w-60 max-lg:w-20"
        [class.!w-20]="sidebarCollapsed()"
        [class.!w-60]="!sidebarCollapsed()"
        style="transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 2px 0 8px rgba(0,0,0,0.05);"
      >
        <app-sidebar
          [collapsed]="sidebarCollapsed()"
          (toggle)="toggleSidebar()"
        />
      </aside>

      <main
        class="flex-1 flex flex-col min-w-0 h-full relative"
      >
        <header
          class="flex justify-between items-center px-6 h-16 sticky top-0 z-10"
          style="background: #ffffff;"
        >
          <div class="flex items-center gap-6">
            <span style="color: #0f172a; font-size: 18px; font-weight: 700; font-family: inherit;">
              Dashboard
            </span>
            <div
              class="flex items-center gap-2 px-3 py-1.5 bg-slate-50 rounded-lg text-slate-400 focus-within:text-slate-600 focus-within:bg-white focus-within:border-slate-300 transition-all duration-200"
              style="width: 220px; border: 1px solid #e2e8f0;"
            >
              <mat-icon style="font-size: 16px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;">
                search
              </mat-icon>
              <input
                type="text"
                placeholder="Search"
                class="bg-transparent border-none outline-none text-xs text-slate-700 w-full"
                style="padding: 0; margin: 0; line-height: 1;"
              />
            </div>
          </div>

          <div class="flex items-center gap-4">
            <button
              mat-icon-button
              class="hover:bg-slate-100 transition-colors"
              style="width: 32px; height: 32px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%;"
              aria-label="Paramètres"
            >
              <mat-icon style="font-size: 20px; width: 20px; height: 20px; color: var(--color-primary);">settings</mat-icon>
            </button>

            <button
              mat-icon-button
              class="hover:bg-emerald-100 transition-colors relative"
              style="width: 32px; height: 32px; border: none; background: var(--color-primary-alpha); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%;"
              aria-label="Notifications"
            >
              <mat-icon style="font-size: 20px; width: 20px; height: 20px; color: var(--color-primary);">notifications</mat-icon>
              <span class="absolute -top-1 -right-1 h-4 w-4 rounded-full bg-amber-500 text-[9px] font-bold text-white flex items-center justify-center border border-white">2</span>
            </button>

            <app-user-menu />
          </div>
        </header>

        <div class="flex-1 overflow-y-auto overflow-x-hidden p-6">
          <router-outlet />
        </div>
      </main>

      <app-toast-container />
    </div>
