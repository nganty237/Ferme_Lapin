<div class="h-screen w-screen flex overflow-hidden bg-white">
  <!-- Section Formulaire (Gauche) -->
  <div class="w-full md:w-1/2 flex flex-col justify-between p-8 md:p-16">
    
    <!-- Back Link -->
    <div>
      <a routerLink="/" class="inline-flex items-center gap-2 text-slate-500 hover:text-slate-800 transition-colors text-sm font-medium decoration-none">
        <mat-icon class="text-base" style="width: 16px; height: 16px; font-size: 16px; display: flex; align-items: center; justify-content: center;">arrow_back</mat-icon>
        <span>Back</span>
      </a>
    </div>

    <!-- Form Box -->
    <div class="max-w-[400px] w-full mx-auto my-auto flex flex-col gap-8">
      <div class="flex flex-col gap-2">
        <h1 class="text-3xl font-extrabold text-slate-900 leading-tight">Let's log you in.</h1>
        <p class="text-sm text-slate-500 leading-relaxed">
          Connectez-vous pour accéder à la plateforme de gestion de votre élevage cunicole.
        </p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
          <label for="username" class="text-xs font-semibold text-slate-600">Your e-mail or username</label>
          <mat-form-field appearance="outline" class="w-full custom-form-field">
            <input matInput id="username" formControlName="username" type="text" placeholder="admin" required />
          </mat-form-field>
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-xs font-semibold text-slate-600">Password</label>
          <mat-form-field appearance="outline" class="w-full custom-form-field">
            <input matInput id="password" formControlName="password" [type]="hidePassword() ? 'password' : 'text'" placeholder="••••••••" required />
            <button type="button" mat-icon-button matSuffix (click)="togglePasswordVisibility()" class="text-slate-400" style="background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;">
              <mat-icon style="font-size: 20px; width: 20px; height: 20px;">{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>
        </div>

        @if (errorMessage()) {
          <div class="text-sm text-rose-600 font-medium bg-rose-50 border border-rose-200 rounded-lg px-3 py-2 flex items-center gap-2">
            <mat-icon class="text-rose-500 text-lg" style="width: 18px; height: 18px; font-size: 18px; display: flex; align-items: center; justify-content: center;">error_outline</mat-icon>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <button mat-flat-button class="custom-login-btn w-full mt-2 py-6 text-sm font-semibold rounded-lg flex items-center justify-center gap-2" type="submit" [disabled]="loginForm.invalid" style="border: none; cursor: pointer;">
          <span>login</span>
          <mat-icon style="font-size: 16px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;">arrow_forward</mat-icon>
        </button>
      </form>
    </div>

    <!-- Bottom Footer -->
    <div class="text-center text-sm text-slate-500">
      <span>Don't have an account ? </span>
      <a class="text-blue-600 font-semibold hover:underline cursor-pointer">Let's Register</a>
    </div>
  </div>

  <!-- Section Image & Dégradé (Droite) -->
  <div class="hidden md:block w-1/2 h-full relative bg-slate-900">
    <img src="assets/images/lapine.jpg" alt="Ferme de lapins" class="w-full h-full object-cover select-none pointer-events-none opacity-85" />
    <div class="absolute inset-0 bg-gradient-to-tr from-slate-950/80 via-slate-900/30 to-transparent"></div>
  </div>
</div>
